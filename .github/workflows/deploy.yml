name: Deploy Next.js to EC2 (via SSM) with Security Scan

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      CLOUDFRONT_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # 공통으로 쓸 변수들 (슬랙 전송용)
      RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

    steps:
      # ----------------------------------------------------------------
      # 1. 초기 설정 및 알림
      # ----------------------------------------------------------------
      - name: Slack - 배포 시작 알림
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "🚀 *${{ github.repository }}* 배포 시작! (보안 검사 포함)",
              "attachments": [{
                "color": "#36a64f",
                "fields": [
                  { "title": "Author", "value": "${{ github.actor }}", "short": true },
                  { "title": "Commit", "value": "${{ github.event.head_commit.message }}", "short": false },
                  { "title": "Action", "value": "<${{ env.RUN_URL }}|View Action>", "short": false }
                ]
              }]
            }

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Tag (Short SHA)
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # ----------------------------------------------------------------
      # 2. 빌드 (Docker Build)
      # ----------------------------------------------------------------
      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      # ----------------------------------------------------------------
      # 3. 보안 스캔 (Trivy) - 상세 로그 & 링크 포함
      # ----------------------------------------------------------------

      # [3-1] 경찰 모드: Critical 이슈 (차단)
      - name: Run Trivy (Block Critical)
        id: trivy_critical
        uses: aquasecurity/trivy-action@0.20.0
        continue-on-error: true
        with:
          image-ref: "${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          format: "table"
          output: "trivy-critical.txt"
          exit-code: "1"
          severity: "CRITICAL"

      # [3-1-Alert] Critical 발견 시 알림 (Total: 0이면 전송 안 함)
      - name: Slack - 🚨 Critical Issue Found
        if: steps.trivy_critical.outcome == 'failure'
        run: |
          # [수정] 0개면 그냥 통과 (알림 안 보냄)
          if grep -q "Total: 0" trivy-critical.txt; then
            echo "No critical issues found."
            exit 0
          fi

          REPORT=$(cat trivy-critical.txt | head -c 2000)

          # JSON 포맷 깨짐 방지를 위해 변수 처리 주의
          # 작성자, 커밋, 링크 정보 추가
          payload=$(cat <<EOF
          {
            "text": "🚨 *치명적인 보안 취약점(CRITICAL) 발견! 배포를 중단합니다.*",
            "attachments": [
              {
                "color": "#ff0000",
                "fields": [
                  { "title": "Author", "value": "${{ github.actor }}", "short": true },
                  { "title": "Action", "value": "<$RUN_URL|View Action>", "short": true },
                  { "title": "Commit", "value": "${{ github.event.head_commit.message }}", "short": false }
                ]
              },
              {
                "color": "#ff0000",
                "title": "Trivy Report Snippet",
                "text": "\`\`\`${REPORT}\`\`\`"
              }
            ]
          }
          EOF
          )

          curl -X POST -H 'Content-type: application/json' --data "$payload" $SLACK_WEBHOOK_URL
          exit 1

      # [3-2] 감시자 모드: High/Medium 이슈 (경고)
      - name: Run Trivy (Monitor High/Medium)
        id: trivy_monitor
        uses: aquasecurity/trivy-action@0.20.0
        continue-on-error: true
        with:
          image-ref: "${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          format: "table"
          output: "trivy-monitor.txt"
          exit-code: "1"
          severity: "HIGH,MEDIUM"

      # [3-2-Alert] High/Medium 발견 시 알림 (Total: 0이면 전송 안 함)
      - name: Slack - ⚠️ Security Warning
        if: steps.trivy_monitor.outcome == 'failure'
        run: |
          # [수정] 0개면 전송 스킵
          if grep -q "Total: 0" trivy-monitor.txt; then
            echo "No high/medium issues found."
            exit 0
          fi

          REPORT=$(cat trivy-monitor.txt | head -c 2000)

          payload=$(cat <<EOF
          {
            "text": "⚠️ *보안 경고(High/Medium)가 있습니다.* (배포는 진행됨)",
            "attachments": [
              {
                "color": "#ffcc00",
                "fields": [
                  { "title": "Author", "value": "${{ github.actor }}", "short": true },
                  { "title": "Action", "value": "<$RUN_URL|View Action>", "short": true },
                  { "title": "Commit", "value": "${{ github.event.head_commit.message }}", "short": false }
                ]
              },
              {
                "color": "#ffcc00",
                "title": "Trivy Report Snippet",
                "text": "\`\`\`${REPORT}\`\`\`"
              }
            ]
          }
          EOF
          )

          curl -X POST -H 'Content-type: application/json' --data "$payload" $SLACK_WEBHOOK_URL

      # ----------------------------------------------------------------
      # 4. 정적 파일 S3 업로드 & CloudFront 무효화
      # ----------------------------------------------------------------
      - name: Extract & Upload Assets to S3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker create --name temp-container $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          mkdir -p ./out_assets/_next/static
          docker cp temp-container:/app/.next/static/. ./out_assets/_next/static/
          docker cp temp-container:/app/public/. ./out_assets/
          docker rm temp-container

          echo "Uploading to S3..."
          aws s3 sync ./out_assets/_next/static s3://$S3_BUCKET_NAME/_next/static --cache-control "public, max-age=31536000, immutable"
          aws s3 sync ./out_assets s3://$S3_BUCKET_NAME --exclude "_next/static/*" --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront
        if: env.CLOUDFRONT_ID != ''
        run: |
          aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_ID --paths "/*"

      # ----------------------------------------------------------------
      # 5. EC2 배포 (Push & SSM)
      # ----------------------------------------------------------------
      - name: Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2 via SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: |
          echo "🚀 Sending deployment command..."
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceids,Values=$INSTANCE_ID" \
            --comment "Deploy ($IMAGE_TAG)" \
            --parameters 'commands=[
              "aws ecr get-login-password --region '"$AWS_REGION"' | docker login --username AWS --password-stdin '"$ECR_REGISTRY"'",
              "docker pull '"$ECR_REGISTRY"'/'"$ECR_REPOSITORY"':'"$IMAGE_TAG"'",
              "docker stop next-app || true",
              "docker rm next-app || true",
              "docker run -d --restart unless-stopped -p 3000:3000 --name next-app -e NODE_ENV=production -e DATABASE_URL=\"'"$DATABASE_URL"'\" -e NEXTAUTH_SECRET=\"'"$NEXTAUTH_SECRET"'\" '"$ECR_REGISTRY"'/'"$ECR_REPOSITORY"':'"$IMAGE_TAG"'",
              "docker image prune -a -f", 
              "for i in {1..10}; do if curl -sf http://localhost:3000 > /dev/null; then echo \"✅ Health Check Passed!\"; exit 0; fi; sleep 3; done;",
              "echo \"❌ Health Check Failed!\"; docker logs next-app --tail 50; exit 1"
            ]' \
            --query "Command.CommandId" --output text)

          # SSM Polling Loop
          while true; do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
            if [ "$STATUS" == "Success" ]; then echo "✅ Success!"; exit 0; fi
            if [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ] || [ "$STATUS" == "TimedOut" ]; then echo "❌ Failed"; exit 1; fi
            sleep 5
          done

      # ----------------------------------------------------------------
      # 6. 최종 성공/실패 알림 (8398a7/action-slack 플러그인 사용)
      # ----------------------------------------------------------------
      - name: Slack - 최종 배포 결과 알림
        uses: 8398a7/action-slack@v3
        if: always() # 성공이든 실패든 무조건 실행
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,took
          author_name: GitHub Actions Notifier
          # 성공 메시지 커스텀
          custom_payload: |
            {
              "attachments": [{
                "color": "${{ job.status == 'success' && 'good' || 'danger' }}",
                "text": "${{ job.status == 'success' && '✅ 배포 완료! (Trivy Scan Passed)' || '❌ 배포 실패!' }}",
                "fields": [
                  { "title": "Repository", "value": "${{ github.repository }}", "short": true },
                  { "title": "Author", "value": "${{ github.actor }}", "short": true },
                  { "title": "Action", "value": "<${{ env.RUN_URL }}|Go to Action>", "short": true },
                  { "title": "Commit", "value": "${{ github.event.head_commit.message }}", "short": false }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
