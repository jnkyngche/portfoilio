name: Deploy Next.js to EC2
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      CLOUDFRONT_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      SLACK_USERNAME: "playground 배포 알림봇"

    steps:
      - name: Slack - 배포 시작 알림
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          username: ${{ env.SLACK_USERNAME }}
          icon_emoji: ":rocket:"
          custom_payload: |
            {
              "text": "🚀 *${{ github.repository }}* 배포 시작! (소스코드 보안 스캔)",
              "attachments": [{
                "color": "#36a64f",
                "fields": [
                  { "title": "Author", "value": "${{ github.actor }}", "short": true },
                  { "title": "Commit", "value": "${{ github.event.head_commit.message }}", "short": false },
                  { "title": "Action", "value": "<${{ env.RUN_URL }}|View Action>", "short": false }
                ]
              }]
            }

      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # 🔥 [Trivy FS 스캔] 문법 오류 해결 완료
      # ----------------------------------------------------------------
      - name: Run Trivy (Filesystem Scan)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          output: "trivy-report.txt"
          exit-code: "0"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Analyze Trivy Results & Notify
        id: security_check
        run: |
          # 1. 보고서 내용 읽기 (이스케이프 처리 추가)
          REPORT=$(cat trivy-report.txt | head -c 2000 | sed 's/"/\\"/g')

          # 2. 결과 분석 및 분기 처리
          if grep -q "Total: 0" trivy-report.txt; then
            echo "✅ No vulnerabilities found."
            exit 0
          fi

          # [CRITICAL 발견 시] -> 배포 중단 (Exit 1)
          if grep -q "CRITICAL" trivy-report.txt; then
            echo "🚨 Critical issues found!"
            
            # JSON 파일 생성 (안전한 방식)
            cat <<EOF > payload.json
            {
              "username": "$SLACK_USERNAME",
              "icon_emoji": ":rotating_light:",
              "text": "🚨 *치명적인 보안 취약점(CRITICAL) 발견! 배포를 중단합니다.*",
              "attachments": [{
                "color": "#ff0000",
                "title": "Trivy Scan Report",
                "text": "\`\`\`${REPORT}\`\`\`"
              }]
            }
            EOF
            
            # 파일 전송 (-d @파일이름)
            curl -X POST -H 'Content-type: application/json' -d @payload.json $SLACK_WEBHOOK_URL
            exit 1
          fi

          # [HIGH/MEDIUM 발견 시] -> 경고만 하고 진행 (Exit 0)
          if grep -q "HIGH" trivy-report.txt || grep -q "MEDIUM" trivy-report.txt; then
            echo "⚠️ Non-critical issues found."
            
            # JSON 파일 생성
            cat <<EOF > payload.json
            {
              "username": "$SLACK_USERNAME",
              "icon_emoji": ":warning:",
              "text": "⚠️ *보안 경고(High/Medium)가 있습니다.* (배포는 진행됨)",
              "attachments": [{
                "color": "#ffcc00",
                "title": "Trivy Scan Report",
                "text": "\`\`\`${REPORT}\`\`\`"
              }]
            }
            EOF
            
            # 파일 전송
            curl -X POST -H 'Content-type: application/json' -d @payload.json $SLACK_WEBHOOK_URL
            exit 0
          fi

      # ----------------------------------------------------------------
      # ✅ AWS 설정 및 빌드
      # ----------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Tag (Short SHA)
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      # ----------------------------------------------------------------
      # 정적 파일 업로드 & EC2 배포
      # ----------------------------------------------------------------
      - name: Extract & Upload Assets to S3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker create --name temp-container $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          mkdir -p ./out_assets/_next/static
          docker cp temp-container:/app/.next/static/. ./out_assets/_next/static/
          docker cp temp-container:/app/public/. ./out_assets/
          docker rm temp-container

          aws s3 sync ./out_assets/_next/static s3://$S3_BUCKET_NAME/_next/static --cache-control "public, max-age=31536000, immutable"
          aws s3 sync ./out_assets s3://$S3_BUCKET_NAME --exclude "_next/static/*" --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront
        if: env.CLOUDFRONT_ID != ''
        run: aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_ID --paths "/*"

      - name: Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2 via SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          echo "🚀 Sending deployment command..."
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceids,Values=$INSTANCE_ID" \
            --comment "Deploy ($IMAGE_TAG)" \
            --parameters 'commands=[
              "aws ecr get-login-password --region '"$AWS_REGION"' | docker login --username AWS --password-stdin '"$ECR_REGISTRY"'",
              "docker pull '"$ECR_REGISTRY"'/'"$ECR_REPOSITORY"':'"$IMAGE_TAG"'",
              "docker stop next-app || true",
              "docker rm next-app || true",
              "docker run -d --restart unless-stopped -p 3000:3000 --name next-app -e NODE_ENV=production -e HOSTNAME=\"0.0.0.0\" '"$ECR_REGISTRY"'/'"$ECR_REPOSITORY"':'"$IMAGE_TAG"'",
              "docker image prune -a -f",
              "echo \"Sleeping 10s...\"",
              "sleep 10",
              "for i in {1..5}; do if curl -sf http://127.0.0.1:3000 > /dev/null; then echo \"✅ Health Check Passed!\"; exit 0; fi; echo \"Retry $i...\"; sleep 3; done;",
              "echo \"❌ Health Check Failed!\"; docker logs next-app --tail 20; exit 1"
            ]' \
            --query "Command.CommandId" --output text)

          echo "Command ID: $COMMAND_ID"

          while true; do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
            if [ "$STATUS" == "Success" ]; then echo "✅ Success!"; exit 0; fi
            if [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ] || [ "$STATUS" == "TimedOut" ]; then
              echo "❌ Failed ($STATUS)"; 
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text;
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text;
              exit 1
            fi
            sleep 5
          done

      - name: Slack - 최종 배포 결과 알림
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,took
          username: ${{ env.SLACK_USERNAME }}
          icon_emoji: "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }}"
          author_name: GitHub Actions Notifier
          custom_payload: |
            {
              "attachments": [{
                "color": "${{ job.status == 'success' && 'good' || 'danger' }}",
                "text": "${{ job.status == 'success' && '✅ 배포 완료! (Trivy Scan Passed)' || '❌ 배포 실패! (로그 확인 필요)' }}",
                "fields": [
                  { "title": "Repository", "value": "${{ github.repository }}", "short": true },
                  { "title": "Author", "value": "${{ github.actor }}", "short": true },
                  { "title": "Action", "value": "<${{ env.RUN_URL }}|Go to Action>", "short": true },
                  { "title": "Commit", "value": "${{ github.event.head_commit.message }}", "short": false }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
