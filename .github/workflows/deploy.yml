name: Deploy Next.js to EC2 (via SSM)

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      CLOUDFRONT_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      # ----------------------------------------------------------------
      # 1. 초기 설정 및 알림
      # ----------------------------------------------------------------
      - name: Slack - 배포 시작 알림
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "🚀 *${{ github.repository }}* 배포가 시작되었습니다! (via SSM)",
              "attachments": [{
                "color": "warning",
                "fields": [
                  { "title": "Author", "value": "${{ github.actor }}", "short": true },
                  { "title": "Branch", "value": "${{ github.ref_name }}", "short": true },
                  { "title": "Commit", "value": "${{ github.event.head_commit.message }}", "short": false }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Tag (Short SHA)
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # ----------------------------------------------------------------
      # 2. 빌드 및 정적 파일 추출 (Build & Extract)
      # ----------------------------------------------------------------
      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      - name: Extract & Upload Assets to S3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker create --name temp-container $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          mkdir -p ./out_assets/_next/static
          docker cp temp-container:/app/.next/static/. ./out_assets/_next/static/
          docker cp temp-container:/app/public/. ./out_assets/
          docker rm temp-container

          echo "Uploading to S3..."
          # 1) _next/static (Immutable)
          aws s3 sync ./out_assets/_next/static s3://$S3_BUCKET_NAME/_next/static \
            --cache-control "public, max-age=31536000, immutable"
            
          # 2) public assets (Mutable)
          aws s3 sync ./out_assets s3://$S3_BUCKET_NAME \
            --exclude "_next/static/*" --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront
        if: env.CLOUDFRONT_ID != '' # Secret이 설정되어 있을 때만 실행
        run: |
          echo "Invalidating CloudFront cache..."
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_ID \
            --paths "/*"

      # ----------------------------------------------------------------
      # 3. 이미지 푸시 및 EC2 배포 (Push & Deploy via SSM)
      # ----------------------------------------------------------------
      - name: Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2 via SSM (with Health Check)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          echo "🚀 Sending deployment command to EC2..."

          # [수정됨] Health Check 로직 추가
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceids,Values=$INSTANCE_ID" \
            --comment "Deploy Next.js App ($IMAGE_TAG)" \
            --parameters 'commands=[
              "aws ecr get-login-password --region '"$AWS_REGION"' | docker login --username AWS --password-stdin '"$ECR_REGISTRY"'",
              "docker pull '"$ECR_REGISTRY"'/'"$ECR_REPOSITORY"':'"$IMAGE_TAG"'",
              "docker stop next-app || true",
              "docker rm next-app || true",
              "docker run -d --restart unless-stopped -p 3000:3000 --name next-app -e NODE_ENV=production '"$ECR_REGISTRY"'/'"$ECR_REPOSITORY"':'"$IMAGE_TAG"'",
              "docker image prune -f",
              "echo Waiting for service to start...",
              "sleep 5",
              "for i in {1..10}; do if curl -sf http://localhost:3000 > /dev/null; then echo \"✅ Health Check Passed!\"; exit 0; fi; echo \"Waiting... $i/10\"; sleep 3; done;",
              "echo \"❌ Health Check Failed! Application is not responding.\"; docker logs next-app --tail 50; exit 1"
            ]' \
            --query "Command.CommandId" --output text)

          echo "Command ID: $COMMAND_ID"
          echo "Waiting for command execution..."

          # SSM 결과 폴링
          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text)
            
            echo "Current Status: $STATUS"

            if [ "$STATUS" == "Success" ]; then
              echo "✅ SSM Command Finished Successfully!"
              exit 0
            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ] || [ "$STATUS" == "TimedOut" ]; then
              echo "❌ SSM Command Failed/Cancelled/TimedOut"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            sleep 5
          done

      # ----------------------------------------------------------------
      # 4. 배포 결과 알림
      # ----------------------------------------------------------------
      - name: Slack - 배포 결과 알림
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
          author_name: GitHub Actions Notifier
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
